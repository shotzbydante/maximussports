    <noscript>
      <h1>Maximus Sports: NFL picks, predictions and betting insights</h1>
      <p>Free NFL picks against the spread, over/under and moneyline for every game, locked at a real sportsbook price and graded in public. Ask Maximus, the AI betting assistant, about any game. Built for sports betting and prediction markets.</p>
      <h2>What it does</h2>
      <ul>
        <li><strong>A call on every NFL game.</strong> Every game on the schedule gets a side against the spread, an over or under on the total, and a moneyline read, ranked from strongest to weakest with one line on why.</li>
        <li><strong>Picks locked at a real price, graded in public.</strong> A recommended pick is locked at one sportsbook’s line and price, with the time it was taken. Every result, win or lose, goes on the public record.</li>
        <li><strong>Ask Maximus, an AI assistant for NFL betting questions.</strong> Ask about any game, pick, price or injury in plain English and get a short answer from the same data the board uses.</li>
        <li><strong>A fair price and win probability for each side.</strong> Each game shows what the market says a side should cost and how often it should win, so you can check a sportsbook line or a prediction-market contract against it.</li>
        <li><strong>Matchups down to the position group.</strong> Every starter is rated. Starters roll up to position groups and the units that line up against each other, on a page for each game and each of the 32 teams.</li>
        <li><strong>Picks by email, and alerts the moment one locks.</strong> Free accounts get the NFL picks email on Thursday and Sunday. Pro ($7.99 a month) adds an email the moment a pick is locked, before the line moves.</li>
      </ul>
      <h2>Ask Maximus</h2>
      <p>An AI assistant that answers NFL betting questions from the live board: the picks, the prices at each sportsbook, injuries, weather and matchups. Three questions a day with no account, ten with a free account, 150 with Pro.</p>
      <h2>Pages</h2>
      <ul>
        <li><a href="/">Home</a>: What Maximus Sports is, with this week’s NFL games live.</li>
        <li><a href="/nfl-picks">NFL picks this week</a>: The current recommended NFL picks and top leans, with price, sportsbook and kickoff. Plain HTML, updated through the week.</li>
        <li><a href="/nfl/insights">NFL picks board</a>: The interactive board: a call on every game in every market.</li>
        <li><a href="/ask-maximus">Ask Maximus</a>: What the AI assistant answers, with example questions and real answers.</li>
        <li><a href="/nfl/ask">Ask Maximus (the app)</a>: Ask an NFL betting question.</li>
        <li><a href="/record">The public record</a>: Every graded pick and lean with its line, price and result.</li>
        <li><a href="/nfl/games">NFL games</a>: This week’s schedule, lines and game pages with matchups and weather.</li>
        <li><a href="/nfl/teams">NFL teams</a>: A page for each of the 32 teams: ratings, roster, schedule and news.</li>
        <li><a href="/about">About Maximus Sports</a>: The product in one page, with questions and answers.</li>
      </ul>
      <h2>Questions and answers</h2>
      <h3>What is Maximus Sports?</h3>
      <p>Maximus Sports is a sports intelligence app for betting and prediction markets. It makes a call on every NFL game against the spread, on the over/under and on the moneyline, locks recommended picks at a real sportsbook price, and grades every result in public. It also covers the NBA, MLB and college basketball.</p>
      <h3>Are the NFL picks free?</h3>
      <p>Yes. The top picks each week are open to everyone, and a free account opens the call on every game plus the NFL picks email on Thursday and Sunday. Pro costs $7.99 a month and adds an email alert the moment a pick is locked, more Ask Maximus questions, and every sportsbook’s price side by side.</p>
      <h3>What is Ask Maximus?</h3>
      <p>Ask Maximus is the AI assistant inside Maximus Sports. You ask an NFL betting question in plain English, such as “Break down the 49ers game” or “How did our picks do today?”, and it answers from the same picks, prices, injuries and matchups shown in the app. It covers the NFL today.</p>
      <h3>Does Maximus Sports work for prediction markets such as Kalshi or Polymarket?</h3>
      <p>Maximus Sports shows a fair price and a win probability for each side of every NFL game, which you can compare with the price of a prediction-market contract on the same game. It does not show prediction-market prices or place trades.</p>
      <h3>How do I know the picks record is real?</h3>
      <p>Each recommended pick is saved with its line, price, sportsbook and the time it was locked, before the game starts. It is graded against the final score and stays on the public record page, win or lose.</p>
      <h3>What is the difference between a recommended pick and a lean?</h3>
      <p>A recommended pick is one where a sportsbook’s price beats the market’s fair price. A lean is the model’s side when no price beats the market: it is saved and graded, but it is not a recommendation to bet.</p>
      <h3>Which sportsbooks and sports does it cover?</h3>
      <p>Prices come from the major U.S. sportsbooks, including FanDuel, BetMGM and BetRivers. The NFL has the deepest coverage. The NBA, MLB and men’s college basketball each have their own section.</p>
      <p>21+. For entertainment and information only. Analysis does not guarantee outcomes. Gambling problem? Call 1-800-GAMBLER.</p>
